name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-linux-x86_64
          path: target/release/tilde

  build-linux-arm:
    name: Build (Linux aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --no-default-features
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-linux-aarch64
          path: target/release/tilde

  build-macos:
    name: Build (macOS aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install libheif
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tilde-macos-aarch64
          path: target/release/tilde

  release:
    name: Create Release
    needs: [build-linux, build-linux-arm, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tilde-linux-x86_64
          path: artifacts/linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: tilde-linux-aarch64
          path: artifacts/linux-aarch64

      - uses: actions/download-artifact@v4
        with:
          name: tilde-macos-aarch64
          path: artifacts/macos-aarch64

      - name: Rename binaries
        run: |
          mv artifacts/linux-x86_64/tilde artifacts/tilde-linux-x86_64
          mv artifacts/linux-aarch64/tilde artifacts/tilde-linux-aarch64
          mv artifacts/macos-aarch64/tilde artifacts/tilde-macos-aarch64
          chmod +x artifacts/tilde-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/tilde-linux-x86_64 \
            artifacts/tilde-linux-aarch64 \
            artifacts/tilde-macos-aarch64
