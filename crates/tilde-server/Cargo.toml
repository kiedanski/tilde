[package]
name = "tilde-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tilde"
path = "src/main.rs"

[features]
default = ["heic"]
heic = ["tilde-photos/heic"]

[dependencies]
tilde-core = { workspace = true }
tilde-cli = { workspace = true }
tilde-dav = { workspace = true }
tilde-cal = { workspace = true }
tilde-card = { workspace = true }
tilde-photos = { workspace = true }
tilde-email = { workspace = true }
tilde-mcp = { workspace = true }
tilde-backup = { workspace = true }
tilde-notify = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
rand = { workspace = true }
minisign-verify = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
sd-notify = { workspace = true }
tokio-util = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
http-body-util = { workspace = true }
arc-swap = { workspace = true }
tilde-core = { workspace = true }
tilde-dav = { workspace = true }
tilde-cal = { workspace = true }
tilde-card = { workspace = true }
tilde-mcp = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
base64 = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
rusqlite = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum-test = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
libc = { workspace = true }
